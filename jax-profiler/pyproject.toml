[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-profiler"
version = "0.1.0"
description = "Industry-standard profiling toolkit for JAX applications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["jax", "profiling", "gpu", "machine-learning", "performance"]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.10.0"]
dev = ["pytest", "black", "isort"]

[project.scripts]
jax-profile = "jax_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jax_profiler*"]
