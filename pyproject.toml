[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-framework"
version = "0.1.0"
description = "Modular JAX/Equinox-based framework for continual learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Allyson Hahn", email = "ahahn2183@gmail.com"},
    {name = "Krishnan Raghavan", email = "krm9c@outlook.com"},
    {name = "Prasanna Balaprakash"}
]
keywords = ["continual-learning", "jax", "equinox", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "equinox>=0.10.0",
    "optax>=0.1.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "scikit-learn>=1.0.0",
]

# NOTE: JAX and PyTorch are NOT included in dependencies above
# They require special CUDA-aware installation for GPU support
# Use polaris_run/setup_cuda.sh or install manually:
#   JAX (GPU): pip install jax[cuda12_pip] -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
#   PyTorch (CPU for data loading): pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

[project.optional-dependencies]
# Graph neural networks
graph = [
    "torch-geometric>=2.0.0",
]
# Plotting
plotting = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
]
# All extras (excludes torch/jax - install separately with CUDA support)
all = [
    "cl-framework[graph,plotting,dev]",
]

[project.urls]
Homepage = "https://github.com/krm9c/ContLearn"
Documentation = "https://github.com/krm9c/ContLearn#readme"
Repository = "https://github.com/krm9c/ContLearn.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: Fast unit tests for individual components",
    "training: Slow integration tests that run full training pipelines",
    "scripts: Legacy marker for training tests (backwards compatibility)",
    "gpu: GPU performance tests (requires GPU and generates reports)",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
