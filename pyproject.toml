[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contlearn"
version = "1.0.0"
description = "Continual Learning with Hamiltonian Gradients and Adaptive Weight Basis (AWB)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "continual-learning",
    "lifelong-learning",
    "jax",
    "equinox",
    "hamiltonian-gradients",
    "neural-networks",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "optax>=0.1.7",
    "jaxtyping>=0.2.25",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
cuda = [
    "jax[cuda12_pip]>=0.4.20",
]

[project.urls]
Homepage = "https://github.com/krm9c/ContLearn"
Repository = "https://github.com/krm9c/ContLearn"

[project.scripts]
contlearn = "run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | __pycache__
    | data
    | outputs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", "__pycache__", "data", "outputs"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests",
    "training: Full pipeline training tests",
    "gpu: Tests requiring GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
