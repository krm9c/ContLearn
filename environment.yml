name: jax_cl
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.9

  # Core dependencies (from pyproject.toml)
  - pip
  - numpy>=1.20.0
  - scikit-learn>=1.0.0

  # Install remaining dependencies via pip
  # (JAX, Equinox, etc. are better installed via pip for GPU support)
  - pip:
    - jax>=0.4.0
    - jaxlib>=0.4.0
    - equinox>=0.10.0
    - optax>=0.1.0
    - torch>=2.0.0
    - torchvision>=0.15.0
    - torch-geometric>=2.0.0
    - tqdm>=4.60.0
    - matplotlib>=3.5.0
    - seaborn>=0.11.0
    - pytest>=7.0.0
    - pytest-cov>=4.0.0
    - black>=23.0.0
    - isort>=5.10.0
    - mypy>=1.0.0
